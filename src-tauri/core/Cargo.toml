[package]
name = "tilly-core"
version = "0.1.1"
description = "Tilly's engine: parses AI-agent logs, tracks live status, and computes the read models, with no UI dependency"
authors = ["xanderlynn"]
license = "MIT"
edition = "2024"

[lib]
name = "tilly_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
rayon = "1"
chrono = "0.4"
dirs = "7"
sha2 = "0.11"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
