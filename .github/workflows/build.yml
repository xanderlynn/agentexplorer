name: Build downloads

# Every push to main produces installers and portable archives as workflow artifacts,
# so each change can be tried before it is released. Tagged releases are
# built by release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            artifact: macos-universal
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            portable-platform: macos
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            args: ""
            artifact: windows-x64
            bundle-dir: src-tauri/target/release/bundle
            portable-platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned development downloads: macOS Gatekeeper and Windows
      # SmartScreen warn on first launch.
      - name: Build app and installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: ${{ matrix.args }}

      - name: Package portable archive
        shell: bash
        env:
          PORTABLE_PLATFORM: ${{ matrix.portable-platform }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/package-portable.mjs --platform "$PORTABLE_PLATFORM" --version "$version"

      - name: Upload installers and portable archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tilly-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            artifacts/*.zip
