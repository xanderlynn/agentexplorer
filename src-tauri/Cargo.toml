[package]
name = "governess"
version = "0.1.0"
description = "Track and improve how you execute with AI coding agents"
authors = ["xanderlynn"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see cargo#8519).
name = "governess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
rayon = "1"
chrono = "0.4"
dirs = "6"
sha2 = "0.10"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "native-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
