[package]
name = "tilly"
version = "0.1.0"
description = "Track and improve how you execute with AI coding agents"
authors = ["xanderlynn"]
license = "MIT"
edition = "2024"

[workspace]
members = ["core"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see cargo#8519).
name = "tilly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tilly-core = { path = "core" }
# Alert sounds: WAV and Ogg only. rodio's MP3 decoder (symphonia) is MPL-2.0.
rodio = { version = "0.23", default-features = false, features = ["wav", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "native-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
