        fill="none" stroke="#047857" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
  <!-- finial -->
  <circle cx="512" cy="250" r="20" fill="#f4f4f5"/>
  <!-- shaft and crook handle -->
  <path d="M512 552 L512 742 A62 62 0 0 1 388 742" fill="none" stroke="#f4f4f5" stroke-width="44"
